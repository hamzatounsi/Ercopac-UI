<!doctype html>
<html lang="en">
<head>
  <script>
    // Apply the cached theme, language and direction before Angular starts, so the first paint is right.
    (function () {
      var root = document.documentElement, theme = null, lang = null;
      try { theme = localStorage.getItem('pm.theme'); lang = localStorage.getItem('pm.lang'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dim' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      root.setAttribute('data-theme', theme);
      if (lang && /^[a-z]{2}$/.test(lang)) {
        root.setAttribute('lang', lang);
        root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      }
    })();
  </script>
  <meta charset="utf-8">
