<section class="forbidden-page">
  <div class="forbidden-panel">
    <div class="eyebrow">{{ 'forbidden.accessRestricted' | translate }}</div>
    <h1>{{ 'forbidden.youDoNotHave' | translate }}</h1>
    <p>{{ 'forbidden.accountAuthenticatedButPage' | translate }}</p>

    <div class="actions">
      <button type="button" class="primary" (click)="goHome()">{{ 'forbidden.goMyWorkspace' | translate }}</button>
      <button type="button" class="secondary" (click)="logout()">{{ 'forbidden.signOut' | translate }}</button>
    </div>
  </div>
</section>
