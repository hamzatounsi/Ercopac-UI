<section class="forbidden-page">
  <div class="forbidden-panel">
    <div class="eyebrow">Access restricted</div>
    <h1>You do not have permission to open this workspace.</h1>
    <p>Your account is authenticated, but this page requires a different role or permission.</p>

    <div class="actions">
      <button type="button" class="primary" (click)="goHome()">Go to my workspace</button>
      <button type="button" class="secondary" (click)="logout()">Sign out</button>
    </div>
  </div>
</section>
