<div class="som" [class.compact]="compact">
  <div class="som-head">
    <span class="som-label" *ngIf="label">{{ label }}</span>
    <span class="som-tag" *ngIf="manual">{{ 'ticketing.selectOrManual.manualEntry' | translate }}</span>
    <button type="button" class="som-switch" *ngIf="allowManual && !disabled" (click)="toggle()">{{ (manual ? linkedLabel : manualLabel) | translate }}</button>
  </div>

  <ng-container *ngIf="!manual; else manualFields">
    <input *ngIf="searchable" class="input som-search" type="search" [(ngModel)]="query" [ngModelOptions]="{ standalone: true }"
           [placeholder]="'ticketing.selectOrManual.search' | translate" [attr.aria-label]="'ticketing.selectOrManual.searchLabel' | translate: { label: label }" [disabled]="disabled || loading">
    <select class="select" [ngModel]="selectedId" [ngModelOptions]="{ standalone: true }" (ngModelChange)="select($event)"
            [disabled]="disabled || loading" [attr.aria-label]="label">
      <option [ngValue]="null">{{ placeholder }}</option>
      <option *ngIf="pinned as p" [ngValue]="p.id">{{ p.label }}</option>
      <option *ngFor="let o of filtered" [ngValue]="o.id">{{ o.label }}<ng-container *ngIf="o.hint"> · {{ o.hint }}</ng-container></option>
    </select>
    <small class="som-note" *ngIf="searchable && query && !filtered.length">{{ 'ticketing.selectOrManual.noMatchQuery' | translate: { query: query } }}</small>
    <small class="field-error" *ngIf="error">{{ error }} <button type="button" class="som-switch" (click)="retry.emit()">{{ 'common.retry' | translate }}</button></small>
  </ng-container>

  <ng-template #manualFields>
    <div class="som-manual"><ng-content></ng-content></div>
  </ng-template>
</div>
