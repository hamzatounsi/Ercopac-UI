<div class="tk-shell">
  <header class="tk-header">
    <a class="tk-logo" routerLink="/tickets">
      <span class="logo-mark material-symbols-outlined">support_agent</span>{{ 'ticketing.layout.projectumTicketing' | translate }}
    </a>

    <app-nav-buttons class="workspace-link" [homes]="['/tickets']"></app-nav-buttons>

    <app-ticket-notifications></app-ticket-notifications>

    <app-profile-menu></app-profile-menu>
  </header>

  <div class="tk-body">
    <aside class="tk-sidebar">
      <section>
        <label>{{ isStaff ? ('ticketing.layout.support' | translate) : ('ticketing.layout.clientPortal' | translate) }}</label>
        <a *ngFor="let item of navItems" [routerLink]="item.route" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: item.exact }" [class.active]="item.icon === 'settings' && inSettings">
          <span class="material-symbols-outlined">{{ item.icon }}</span>{{ item.label | translate }}
        </a>
      </section>

      <div class="org-card">
        <div class="org-logo">{{ organisation.charAt(0) }}</div>
        <div>
          <strong>{{ organisation }}</strong>
          <small>{{ roleLabel }}</small>
        </div>
      </div>
    </aside>

    <main class="tk-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
