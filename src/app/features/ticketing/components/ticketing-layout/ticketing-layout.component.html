<div class="tk-shell">
  <header class="tk-header">
    <a class="tk-logo" routerLink="/tickets">
      <span class="logo-mark material-symbols-outlined">support_agent</span>Projectum Ticketing
    </a>

    <button class="workspace-link" type="button" (click)="handleWorkspaceNavigation()">
      <span class="material-symbols-outlined">{{ showLogoutInsteadOfWorkspace ? 'logout' : 'apps' }}</span>
      {{ showLogoutInsteadOfWorkspace ? 'Logout' : 'Workspaces' }}
    </button>

    <div class="header-user">
      <div class="avatar">{{ initials }}</div>
      <div>
        <strong>{{ userName }}</strong>
        <small>{{ organisation }}</small>
      </div>
    </div>
  </header>

  <div class="tk-body">
    <aside class="tk-sidebar">
      <section>
        <label>{{ isStaff ? 'Support' : 'Client portal' }}</label>
        <a *ngFor="let item of navItems" [routerLink]="item.route" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: item.exact }">
          <span class="material-symbols-outlined">{{ item.icon }}</span>{{ item.label }}
        </a>
      </section>

      <section>
        <a class="new-ticket" routerLink="/tickets/new" routerLinkActive="active">
          <span class="material-symbols-outlined">add_circle</span>New ticket
        </a>
      </section>

      <div class="org-card">
        <div class="org-logo">{{ organisation.charAt(0) }}</div>
        <div>
          <strong>{{ organisation }}</strong>
          <small>{{ roleLabel }}</small>
        </div>
      </div>
    </aside>

    <main class="tk-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
