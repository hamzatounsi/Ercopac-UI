<main class="page-pad">
  <header class="view-head">
    <div>
      <h1>{{ isStaff ? 'Platform settings' : 'Settings' }}</h1>
      <p *ngIf="isStaff">{{ isLead ? 'Configure the support team, ticket wording, SLA targets and customers.' : 'Read-only: only support leads can change these settings.' }}</p>
    </div>
  </header>
  <div class="settings-shell">
    <nav class="panel settings-nav" aria-label="Settings sections">
      <ng-container *ngFor="let g of groups">
        <div class="sec-label">{{ g.label }}</div>
        <a *ngFor="let i of g.items" [routerLink]="i.path" routerLinkActive="on">
          <span class="material-symbols-outlined">{{ i.icon }}</span>{{ i.label }}
        </a>
      </ng-container>
    </nav>
    <section class="panel settings-body">
      <router-outlet></router-outlet>
    </section>
  </div>
</main>
