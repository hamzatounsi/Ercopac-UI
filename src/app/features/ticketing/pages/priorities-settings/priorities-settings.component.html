<div>
  <h2 class="text-2xl font-bold mb-2 text-gray-800">Priority levels</h2>
  <p class="text-gray-600 mb-6">Configure ticket priority levels and their SLA targets.</p>

  <div class="bg-white rounded-lg shadow overflow-hidden">
    <table class="w-full">
      <thead>
        <tr class="border-b bg-gray-50">
          <th class="text-left p-4 font-semibold text-gray-600">PRIORITY</th>
          <th class="text-left p-4 font-semibold text-gray-600">FIRST RESPONSE SLA</th>
          <th class="text-left p-4 font-semibold text-gray-600">RESOLUTION SLA</th>
          <th class="text-left p-4 font-semibold text-gray-600">ACTIONS</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let priority of priorities" class="border-b last:border-b-0 hover:bg-gray-50">
          <td class="p-4">
            <span class="px-3 py-1 rounded-full text-sm font-medium" [ngClass]="getPriorityBadgeClass(priority.priority)">
              {{ priority.label }}
            </span>
          </td>
          <td class="p-4">
            <div class="flex items-center gap-2">
              <input type="number" [(ngModel)]="priority.firstResponseSlaHours" class="border border-gray-300 rounded px-3 py-1 w-24" min="1">
              <span class="text-gray-600 text-sm">hours</span>
            </div>
          </td>
          <td class="p-4">
            <div class="flex items-center gap-2">
              <input type="number" [(ngModel)]="priority.resolutionSlaHours" class="border border-gray-300 rounded px-3 py-1 w-24" min="1">
              <span class="text-gray-600 text-sm">hours</span>
            </div>
          </td>
          <td class="p-4">
            <button (click)="savePriority(priority)" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm font-medium">
              Save
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
