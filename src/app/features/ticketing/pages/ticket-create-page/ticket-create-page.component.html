<main class="ticket-shell"><button class="ghost back" routerLink="/tickets">← Back to tickets</button><header class="ticket-head"><div><p class="eyebrow">Customer care workspace</p><h1>New ticket</h1><p>Describe the issue clearly so the support team can act quickly.</p></div></header><section class="detail-card form-card"><form [formGroup]="form" (ngSubmit)="save()"><div class="form-grid"><label>Subject<input formControlName="subject" placeholder="Briefly describe the request"></label><label>Category<select formControlName="category"><option>SOFTWARE</option><option>ACCESS</option><option>PERFORMANCE</option><option>BILLING</option><option>DATA</option><option>INTEGRATION</option><option>FEATURE_REQUEST</option><option>OTHER</option></select></label><label>Priority<select formControlName="priority"><option>LOW</option><option>MEDIUM</option><option>HIGH</option><option>CRITICAL</option></select></label><label>Origin<select formControlName="origin"><option>WEB</option><option>EMAIL</option><option>PHONE</option><option>INTERNAL</option><option>OTHER</option></select></label><label>Site / location<input formControlName="site" placeholder="Optional site"></label><label>Initial message<input formControlName="initialMessage" placeholder="Optional conversation opener"></label><label>Description<textarea formControlName="description" placeholder="Include impact, expected result, and useful context."></textarea></label></div><p class="error" *ngIf="error">{{error}}</p><div class="form-actions"><button class="ghost" type="button" routerLink="/tickets">Cancel</button><button class="primary" [disabled]="saving">{{saving?'Creating…':'Create ticket'}}</button></div></form></section></main>
