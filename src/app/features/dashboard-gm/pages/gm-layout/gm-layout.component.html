<div class="shell no-sidebar-shell">
  <app-projectum-project-header
    *ngIf="showSharedHeader"
    class="shell-header">
    <button class="main-menu-btn" type="button" (click)="handleMainNavigation()">
      <span class="material-symbols-outlined">{{ showLogoutInsteadOfMainMenu ? 'logout' : 'home' }}</span>
      <span>{{ showLogoutInsteadOfMainMenu ? 'Logout' : 'Main Menu' }}</span>
    </button>
  </app-projectum-project-header>

  <main
    class="main-content full-width"
    [class.has-shared-header]="showSharedHeader"
    id="gm-main-content"
    tabindex="-1">
    <router-outlet></router-outlet>
  </main>
</div>
