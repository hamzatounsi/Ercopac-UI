<main class="milestone-page">
  <app-projectum-workspace-header title="Project milestones" subtitle="Scheduled milestones by project." [showProjectModules]="false">
    <div projectumHeaderActions class="date-filter"><label>From <input type="date" [(ngModel)]="startDate"></label><label>To <input type="date" [(ngModel)]="endDate"></label><button type="button" (click)="loadMilestones()">Apply</button></div>
  </app-projectum-workspace-header>
  <p *ngIf="errorMessage" class="message error">{{ errorMessage }}</p><p *ngIf="loading" class="message">Loading milestones…</p>
  <section *ngIf="!loading && !projects.length" class="empty-state">No accessible projects.</section>
  <section *ngIf="!loading && projects.length" class="timeline-card">
    <div class="timeline-scroll"><div class="timeline-table" [style.min-width.px]="timelineWidth">
      <div class="timeline-header"><div class="project-column sticky">Project</div><div class="months"><div *ngFor="let month of months" [style.width.%]="month.width">{{ month.label }}</div></div></div>
      <div *ngFor="let project of projects; trackBy: trackProject" class="timeline-row"><div class="project-column sticky"><strong>{{ projectTitle(project) }}</strong><span *ngIf="project.code">{{ project.code }}</span></div><div class="track"><span *ngFor="let milestone of milestonesFor(project.id); trackBy: trackMilestone" class="marker" [style.left.%]="milestoneOffset(milestone)" [style.background-color]="milestone.milestoneTypeColor" [title]="(milestone.milestoneTypeLabel || milestone.milestoneTypeCode) + ' — ' + formatDate(milestone.milestoneDate)">{{ milestone.milestoneTypeCode }}</span></div></div>
    </div></div>
  </section>
</main>
