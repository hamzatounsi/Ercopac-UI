<aside class="project-side-panel">
  <nav class="panel-nav">

    <button type="button" class="panel-link" (click)="goToProjectum()">
      <span class="panel-icon material-symbols-outlined">dashboard</span>
      <span>Projects</span>
    </button>

    <div class="panel-project-label">
      Project {{ projectId || '—' }}
    </div>

    <button
      type="button"
      class="panel-link"
      [class.active]="currentPage === 'gantt'"
      (click)="goToSchedule()">
      <span class="panel-icon material-symbols-outlined">timeline</span>
      <span>Gantt</span>
    </button>

    <button
      type="button"
      class="panel-link"
      [class.active]="currentPage === 'actions'"
      (click)="goToActions()">
      <span class="panel-icon material-symbols-outlined">assignment_turned_in</span>
      <span>Actions</span>
    </button>

    <button
      type="button"
      class="panel-link"
      [class.active]="currentPage === 'finance'"
      (click)="goToFinance()">
      <span class="panel-icon material-symbols-outlined">payments</span>
      <span>Finance</span>
    </button>

    <button
      type="button"
      class="panel-link"
      [class.active]="currentPage === 'forecast'"
      (click)="goToForecast()">
      <span class="panel-icon material-symbols-outlined">trending_up</span>
      <span>Forecast</span>
    </button>

    <button
      type="button"
      class="panel-link"
      [class.active]="currentPage === 'risk'"
      (click)="goToRisks()">
      <span class="panel-icon material-symbols-outlined">warning</span>
      <span>Risk</span>
    </button>

    <button
      type="button"
      class="panel-link"
      [class.active]="currentPage === 'cr'"
      (click)="goToCr()">
      <span class="panel-icon material-symbols-outlined">contract_edit</span>
      <span>CR</span>
    </button>

    <button class="logout-btn" (click)="logout()">
      <span class="material-symbols-outlined">
        logout
      </span>
      Logout
    </button>

  </nav>
</aside>
