<header class="app-header">
  <div class="app-brand">
    <div class="app-logo">
      <span class="material-symbols-outlined">folder_managed</span>
    </div>

    <div class="app-brand-text">
      <div class="app-name">{{ 'gm.header.projectum' | translate }}</div>
      <div class="app-sub">{{ 'gm.header.gmWorkspace' | translate }}</div>
    </div>
  </div>

  <div class="app-breadcrumb">
    <span class="crumb">{{ 'gm.header.generalManager' | translate }}</span>
    <span class="crumb-sep">/</span>
    <span class="crumb current">{{ 'gm.header.projectum' | translate }}</span>
    <ng-content select="[breadcrumb]"></ng-content>
  </div>

  <div class="hdr-right">
    <app-projectum-notifications></app-projectum-notifications>

    <ng-content></ng-content>
    <app-profile-menu></app-profile-menu>
  </div>
</header>
