
name: Build and Deploy Frontend to Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy staging frontend
        uses: appleboy/ssh-action@v1.2.0
        env:
          ROOT: ${{ vars.STAGING_ROOT }}
          SERVICE: ${{ vars.STAGING_FRONTEND_SERVICE }}
          HEALTH_URL: ${{ vars.STAGING_FRONTEND_HEALTH_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: 22
          command_timeout: 30m
          envs: ROOT,SERVICE,HEALTH_URL,EXPECTED_SHA
          script: |
            set -eu

            test -n "$ROOT"
            test -n "$SERVICE"
            test -n "$HEALTH_URL"
            test "$ROOT" != "/opt/projectum"

            cd "$ROOT/frontend"
            git fetch origin staging
            git switch staging
            git merge --ff-only origin/staging
            test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

            cd "$ROOT"
            docker compose config --services | grep -Fx "$SERVICE"
            docker compose build "$SERVICE"
            docker compose up -d --no-deps "$SERVICE"

            echo "Checking staging frontend..."
            HEALTHY=false
            for i in $(seq 1 12); do
              if curl -fsS "$HEALTH_URL" > /dev/null; then
                HEALTHY=true
                break
              fi
              sleep 5
            done

            test "$HEALTHY" = true
            echo "Staging frontend deployed: $EXPECTED_SHA"
            docker compose ps "$SERVICE"
