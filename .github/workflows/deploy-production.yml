name: Deploy Frontend to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy frontend on production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 30m
          script_stop: true
          script: |
            set -e
            echo "=== Connexion au serveur ==="
            cd /opt/projectum

            echo "=== MAGIE : Modification auto du docker-compose.yml ==="
            # Cette commande remplace "build: ." par l'image GitHub automatiquement
            sed -i 's|build: \.|image: ghcr.io/hamzatounsi/ercopac-ui/frontend:latest|g' docker-compose.yml

            echo "=== Connexion au registre GitHub ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "=== Téléchargement de l'image (0 RAM utilisée) ==="
            docker compose pull projectum-frontend

            echo "=== Redémarrage du conteneur ==="
            docker compose up -d --no-deps projectum-frontend

            echo "=== Vérification ==="
            sleep 5
            docker compose ps projectum-frontend
            echo "✅ DÉPLOIEMENT RÉUSSI !"