name: Deploy Frontend to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy frontend on production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 30m
          script_stop: true
          script: |
            set -e
            echo "=== Move to project directory ==="
            cd /opt/projectum
            echo "=== Login to GitHub Container Registry ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            echo "=== Pull pre-built image ==="
            docker compose pull projectum-frontend
            echo "=== Recreate frontend container ==="
            docker compose up -d --no-deps projectum-frontend
            echo "=== Health check ==="
            sleep 5
            curl -f http://localhost:8080/ || exit 1
            echo "✅ SUCCESS"